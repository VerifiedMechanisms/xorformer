name = "head-complexity-new"
version = "0.2.0"
keywords = ["math"]
defaultTargets = ["HeadComplexity"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The upstream header check requires Mathlib's copyright format.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "HeadComplexity"
